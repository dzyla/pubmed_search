# /etc/nginx/sites-available/manuscript-search.org
# Certbot-managed lines are kept as on the live server (2026-10-08).
server {
    server_name manuscript-search.org www.manuscript-search.org;

    include /etc/nginx/snippets/mss-locations.conf;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/manuscript-search.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/manuscript-search.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.manuscript-search.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = manuscript-search.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name manuscript-search.org www.manuscript-search.org;
    return 404; # managed by Certbot
}
