# /etc/nginx/conf.d/mss-ratelimit.conf  (http context)
# One search uses ~3 cores for several seconds; keep a single client from
# monopolising the 4-vCPU box. The UI does not go through these limits
# (Streamlit talks to the backend on localhost).
limit_req_zone $binary_remote_addr zone=mss_api:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mss_mcp:10m rate=30r/m;
# The paper map: a view loads ~20-60 tiles, and clicks look up papers at a point.
limit_req_zone $binary_remote_addr zone=mss_tiles:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=mss_map:10m rate=60r/m;
limit_req_status 429;
