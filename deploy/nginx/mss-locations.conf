# /etc/nginx/snippets/mss-locations.conf — included by every Manuscript Search
# server block (manuscript-search.org, msssearch.org) so they cannot drift apart.

# Friendly page while the services restart
error_page 502 503 504 /maintenance.html;
location = /maintenance.html {
    root /var/www/mss;
    internal;
}

# --- Paper map (backend :8080): tiles are immutable per map version ---
location ^~ /map/tiles/ {   # ^~: no regex location may take these
    limit_req zone=mss_tiles burst=200 nodelay;
    proxy_pass         http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
}
location ~ ^/v1/map {
    limit_req zone=mss_map burst=20 nodelay;
    proxy_pass         http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# --- REST API (backend :8080) ---
location ~ ^/(search|v1/|docs|redoc|openapi\.json|health|signup) {
    limit_req zone=mss_api burst=5 nodelay;
    proxy_pass         http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
}

# --- MCP endpoint for AI agents (backend :8080/mcp/) ---
location /mcp {
    limit_req zone=mss_mcp burst=10 nodelay;
    proxy_pass         http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;            # streamable HTTP may use SSE
    proxy_read_timeout 120s;
}

# --- Web UI (Streamlit :8501) ---
location / {
    proxy_pass http://127.0.0.1:8501/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_redirect off;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_connect_timeout 120s;
    proxy_http_version 1.1;
    proxy_buffering off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Fonts from Google; no third-party images any more.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:" always;
}

location /static/ {
    proxy_pass http://127.0.0.1:8501/static/;
}
