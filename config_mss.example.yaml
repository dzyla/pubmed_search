# Copy to config_mss.yaml (git-ignored) and point the paths at your data.
# Relative paths are resolved from the working directory of search_api.py;
# MSS_CONFIG_PATH selects a different file.
# Identifier index + PubMed superseded rows (built by update_database/build_aux_indexes.py)
aux_index_root: "./data/aux_index"

pubmed_config:
  embeddings_directory: "./data/pubmed26_update_embed/"
  xml_directory: "./data/pubmed26_update_xmls/"
  npy_files_pattern: "*.npy"
  chunk_dir: "./data/chunked/chunked_pubmed_embeddings/"
  metadata_path: "./data/pubmed_chunked_metadata.json"
  data_folder: "./data/pubmed26_parquet_files/"
  chunk_size_bytes: 1073741824  # 512MB in bytes

