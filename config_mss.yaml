# Identifier index + PubMed superseded rows (built weekly on the desktop, synced nightly)
aux_index_root: "/root/pubmed_semantic_search/aux_index"

pubmed_config:
  embeddings_directory: "/root/pubmed_semantic_search/pubmed26_update_embed/"
  xml_directory: "/root/pubmed_semantic_search/pubmed26_update_xmls/"
  npy_files_pattern: "*.npy"
  chunk_dir: "/root/chunked/chunked_pubmed_embeddings/"
  metadata_path: "/root/pubmed_semantic_search/pubmed_chunked_metadata.json"
  data_folder: "/root/pubmed_semantic_search/pubmed26_parquet_files/"
  chunk_size_bytes: 1073741824  # 512MB in bytes

biorxiv_config:
  embeddings_directory: "/root/pubmed_semantic_search/biorxiv_embed_binary/"
  npy_files_pattern: "*.npy"
  combined_data_file: "/root/pubmed_semantic_search/biorxiv_embed_binary/biorxiv_metadata.parquet"
  chunk_dir: "/root/chunked/chunked_biorxiv_embeddings/"
  metadata_path: "/root/pubmed_semantic_search/biorxiv_chunked_memmap_metadata.json"
  data_folder:        "/root/pubmed_semantic_search/biorxiv_embed_binary/"
  chunk_size_bytes: 1073741824

